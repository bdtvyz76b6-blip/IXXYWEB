<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IXXY — Личный кабинет</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page cabinet-page">

  <div class="top">
    <div class="brand">☂️ IXXY</div>
    <a href="index.html" class="back">Выйти</a>
  </div>

  <div class="profile">
    <div class="avatar">☂️</div>

    <div>
      <div class="profile-name" id="username">
        Пользователь
      </div>

      <div class="profile-id" id="telegramId">
        Telegram ID
      </div>
    </div>
  </div>

  <div class="days-card">

    <div class="status">
      <span class="status-dot"></span>
      Подписка активна
    </div>

    <div class="days" id="days">
      0
    </div>

    <div class="days-title">
      дней осталось
    </div>

    <div class="until" id="until">
      —
    </div>

  </div>

  <div class="actions">

    <a
      id="subscriptionLink"
      class="button primary"
      href="#"
      target="_blank"
    >
      🔗 Открыть подписку
    </a>

    <button class="button secondary" onclick="buySubscription()">
      💳 Продлить подписку
    </button>

  </div>

  <div class="card info-card">

    <div class="info-row">
      <span>Статус</span>
      <strong id="status">Активна</strong>
    </div>

    <div class="info-row">
      <span>Пользователь</span>
      <strong id="username2">—</strong>
    </div>

    <div class="info-row">
      <span>Telegram ID</span>
      <strong id="telegramId2">—</strong>
    </div>

  </div>

  <div class="footer">
    ☂️ IXXY VPN
  </div>

</div>

<script src="app.js"></script>

<script>
  loadCabinet();
</script>

</body>
</html>
