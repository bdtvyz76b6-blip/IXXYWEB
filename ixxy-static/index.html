<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>☂️ IXXY VPN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

    <div class="logo">☂️</div>

    <h1>IXXY VPN</h1>

    <p class="subtitle">
        Быстрый доступ к вашему VPN
    </p>

    <div class="card">

        <div class="tabs">
            <button
                id="loginTab"
                class="tab active"
                onclick="showLogin()"
            >
                Войти
            </button>

            <button
                id="registerTab"
                class="tab"
                onclick="showRegister()"
            >
                Регистрация
            </button>
        </div>

        <div id="message"></div>

        <div id="loginForm">

            <input
                id="login"
                placeholder="Telegram ID или username"
                autocomplete="username"
            >

            <button
                class="main-button"
                onclick="login()"
            >
                Войти
            </button>

        </div>

        <div id="registerForm" class="hidden">

            <input
                id="telegramId"
                placeholder="Telegram ID"
                inputmode="numeric"
            >

            <input
                id="username"
                placeholder="Username без @"
            >

            <input
                id="firstName"
                placeholder="Имя"
            >

            <button
                class="main-button"
                onclick="register()"
            >
                Создать аккаунт
            </button>

        </div>

    </div>

    <div class="support">
        <a
            id="supportLink"
            href="#"
            target="_blank"
        >
            Поддержка
        </a>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
